services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://backend:3000   # ← nombre del servicio backend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped